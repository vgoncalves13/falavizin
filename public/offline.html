<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#FD5C3E">
    <title>Sem conexão — FalaVizin</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #fafaf9;
            color: #1c1917;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }
        main {
            width: min(100%, 440px);
            padding: 32px;
            text-align: center;
            background: #fff;
            border: 1px solid #e7e5e4;
            border-radius: 24px;
        }
        img { width: 80px; height: 80px; border-radius: 20px; }
        h1 { margin: 22px 0 8px; font-size: 1.5rem; }
        p { margin: 0; color: #57534e; line-height: 1.55; }
        button {
            margin-top: 24px;
            padding: 11px 20px;
            color: #fff;
            font: inherit;
            font-weight: 700;
            background: #FD5C3E;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/assets/icons/icon-192.png" alt="">
        <h1>Você está sem conexão</h1>
        <p>O FalaVizin precisa de internet para carregar conteúdos atualizados e proteger seus dados.</p>
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
